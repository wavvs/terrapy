[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrapy"
dynamic = ["version"]
description = "A Python wrapper for the Terraform and OpenTofu CLIs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "terrapy contributors" },
]
keywords = ["terraform", "opentofu", "tofu", "infrastructure", "iac", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "build>=1.0",
]

[tool.setuptools.dynamic]
version = { attr = "terrapy._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
terrapy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["terrapy"]
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test assertions frequently compare long literal tuples; splitting them
# across lines hurts readability more than the line-length limit helps.
"tests/**" = ["E501"]
